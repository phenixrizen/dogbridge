version: "3.9"
services:
  demo-emitter:
    build:
      context: ../go-ddtrace
    environment:
      - DD_TRACE_AGENT_URL=http://dogbridge:8126
      - DD_DOGSTATSD_ADDR=dogbridge:8125
    depends_on:
      - dogbridge

  dogbridge:
    image: otel/opentelemetry-collector-contrib:0.151.0
    command: ["--config=/etc/dogbridge/config.yaml"]
    volumes:
      - ./dogbridge.yaml:/etc/dogbridge/config.yaml:ro
    ports:
      - "8126:8126"
      - "8125:8125/udp"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - victoriametrics

  tempo:
    image: grafana/tempo:2.8.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4319:4317"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.123.1
    command:
      - "-selfScrapeInterval=10s"
    ports:
      - "8428:8428"

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - tempo
      - victoriametrics
