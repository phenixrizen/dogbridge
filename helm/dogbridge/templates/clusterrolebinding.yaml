{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dogbridge.fullname" . }}-metadata-reader
  labels:
    {{- include "dogbridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dogbridge.fullname" . }}-metadata-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "dogbridge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
